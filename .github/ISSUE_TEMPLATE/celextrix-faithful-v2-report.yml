name: CELEXTRIX v2 — Active Red-Team report
description: Report a checker-confirmed v2 control witness, checker-faithfulness defect, or Stage-B theorem contradiction
title: "[CELEXTRIX V2 RED TEAM] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **V2 is the active public CELEXTRIX red-team target.** Use this form only for `celextrix-impossible-return-faithful-v2`.

        Stage A is an intentional blindness control. Stage B is theorem-faithful only after the implementation-faithfulness and theorem gates close. The challenge is bounded to the frozen finite protocol; it is not authorization to attack unrelated services, accounts, hosting, or devices.

        Do not include passwords, tokens, private keys, personal data, destructive payloads, or attacks against unrelated services.

  - type: dropdown
    id: classification
    attributes:
      label: Report classification
      options:
        - Stage A control witness — BREAK_ACCEPTED_STAGE_A_CONTROL
        - Checker faithfulness defect — CHECKER_FAITHFULNESS_FAILURE
        - Stage B theorem contradiction — THEOREM_CONTRADICTION_STAGE_B
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Exact checker commit SHA
      placeholder: 40-character Git commit SHA
    validations:
      required: true

  - type: textarea
    id: submission
    attributes:
      label: Exact canonical submission bytes
      description: Paste the complete non-secret canonical one-line submission. State explicitly whether the final LF was present.
      render: text
    validations:
      required: true

  - type: textarea
    id: certificate
    attributes:
      label: Exact checker certificate
      description: Paste the complete machine-readable output.
      render: json
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and argument
      description: Explain how the frozen wire grammar, Genesis, implementation manifest, faithfulness gate, and theorem gate were preserved.
    validations:
      required: true

  - type: checkboxes
    id: attestations
    attributes:
      label: Attestations
      options:
        - label: I reproduced this on the exact reported commit.
          required: true
        - label: I did not modify Genesis, the implementation manifest, checker files, or the admitted wire grammar.
          required: true
        - label: This report concerns only the authorized finite challenge and contains no credentials, secrets, personal data, or destructive payloads.
          required: true
