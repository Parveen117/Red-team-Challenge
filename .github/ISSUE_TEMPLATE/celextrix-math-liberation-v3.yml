name: CELEXTRIX v3 — Framework theorem/reproducibility report
description: Report a proof-transcript contradiction, specification ambiguity, or independent-verifier disagreement for Framework Establishment I
 title: "[CELEXTRIX V3 FRAMEWORK] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **V3 is a mathematical framework-establishment reference, not the primary CELEXTRIX red-team challenge.** Use v2 for the active adversarial challenge.

        V3 mathematical authority is the published finite relation plus the proof transcript, not any single checker binary or file hash. This form is retained for theorem contradictions, specification ambiguities, proof-transcript defects, and independent-verifier disagreements.

        Do not include credentials, secrets, personal data, destructive payloads, or attacks against unrelated systems.

  - type: dropdown
    id: class
    attributes:
      label: Report class
      options:
        - Stage B theorem contradiction
        - Independent verifier disagreement
        - Proof transcript validation defect
        - Specification ambiguity
        - Reproducibility failure
    validations:
      required: true

  - type: textarea
    id: submission
    attributes:
      label: Canonical submission
      render: text
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: Complete canonical proof transcript
      render: json
    validations:
      required: true

  - type: textarea
    id: js
    attributes:
      label: JavaScript verifier output
      render: json
    validations:
      required: true

  - type: textarea
    id: python
    attributes:
      label: Python or other independent verifier output
      render: json
    validations:
      required: true

  - type: textarea
    id: argument
    attributes:
      label: Mathematical / reproducibility argument
      description: Explain exactly which published finite equation, witness relation, specification clause, or reproduction obligation closes or fails.
    validations:
      required: true

  - type: checkboxes
    id: attestations
    attributes:
      label: Attestations
      options:
        - label: The report concerns only the published finite v3 framework relation.
          required: true
        - label: I included the complete non-secret proof transcript needed for independent reproduction.
          required: true
        - label: This report contains no credentials, secrets, personal data, or destructive payloads.
          required: true
