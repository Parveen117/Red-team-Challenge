name: Apply SETU hardware-endpoint wording

on:
  push:
    branches:
      - agent/setu-hardware-endpoint-wording

permissions:
  contents: write

jobs:
  rewrite-public-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out wording branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Replace phone framing with bounded hardware-endpoint framing
        shell: python
        run: |
          from pathlib import Path

          changes = {
              "README.md": [
                  (
                      """A second, different kind of target: a working communication protocol you
          can attack from a browser with no install and no account.""",
                      """A second, different kind of target: a working communication protocol for
          independent hardware endpoints, demonstrated in-browser with no install and
          no account.""",
                  ),
              ],
              "index.html": [
                  (
                      """<a class=\"card\" href=\"setu_connect_v1/web/index.html\">
            <h2>SETU Connect v1 — live browser challenge</h2>
            <p>Attack a working messaging protocol from your browser: read an
            intercepted message, tamper with it, forge a sender, or open it as the
            server. No install, no account.</p></a>""",
                      """<a class=\"card\" href=\"setu_connect_v1/web/index.html\">
            <h2>SETU Connect v1 — hardware-endpoint trust challenge</h2>
            <p>Attack a communication grammar designed for independent hardware
            endpoints: read an intercepted message, tamper with it, forge a sender,
            or open it as the server. No install, no account.</p></a>""",
                  ),
              ],
              "setu_connect_v1/README.md": [
                  (
                      "| [`web/demo.html`](web/demo.html) | **The demo.** Monty and Asha, two phones on one page, with the relay's entire view printed live underneath. |",
                      "| [`web/demo.html`](web/demo.html) | **The demo.** Monty and Asha, two independent hardware endpoints represented on one page, with the relay's entire view printed live underneath. |",
                  ),
              ],
              "setu_connect_v1/index.html": [
                  ("<title>Index</title>", "<title>SETU Connect v1 — hardware endpoints</title>"),
                  ("<a href=\"web/\">Continue</a>", "<a href=\"web/\">Enter the hardware-endpoint challenge</a>"),
              ],
              "setu_connect_v1/web/index.html": [
                  (
                      "<h2><span>01</span> &nbsp;Watch two people connect</h2>",
                      "<h2><span>01</span> &nbsp;Watch two hardware endpoints establish trust</h2>",
                  ),
                  (
                      """  <p>Monty and Asha, two phones on one page. Copy one code, paste it on the
            other, accept, talk — and read the panel at the bottom showing everything the
            server carries while they do it.</p></a>""",
                      """  <p>Monty and Asha, two independent hardware endpoints represented on one
            page. Present one code to the other endpoint, accept, talk — and read the
            panel at the bottom showing everything the server carries.</p></a>""",
                  ),
              ],
              "setu_connect_v1/web/demo.html": [
                  ("<title>SETU demo — two devices, one page</title>", "<title>SETU demo — two hardware endpoints, one page</title>"),
                  (
                      """  <p>Two devices on one page, real WebCrypto (Ed25519 identities, X25519 +
            AES-GCM envelopes), the real capsule grammar. The relay between them is
            in-memory here — and it is shown below, so you can see for yourself that
            it only ever holds ciphertext.</p>""",
                      """  <p>Two independent hardware endpoints represented on one page, using real
            WebCrypto (Ed25519 identities, X25519 + AES-GCM envelopes) and the real
            capsule grammar. The relay between them is in-memory here — and it is shown
            below, so you can see for yourself that it only ever holds ciphertext.</p>""",
                  ),
                  (
                      """// On this demo page both \"phones\" share one camera (one page, one device);
          // on real phones each has its own. The signalling path is the real one:""",
                      """// This page represents two hardware endpoints on one physical device, so they
          // share one camera; on separate hardware, each endpoint has its own. The
          // signalling path is the real one:""",
                  ),
                  ("${label}’s phone</h2>", "${label}’s hardware endpoint</h2>"),
                  ("code copied — paste it on the other phone", "code copied — present it to the other hardware endpoint"),
                  ("Copy the other phone’s connect-code first.", "Copy the other hardware endpoint’s connect-code first."),
                  ("That is this phone’s own code — copy the other one.", "That is this hardware endpoint’s own code — copy the other one."),
              ],
              "setu_connect_v1/web/connect.html": [
                  (
                      """  <p>No server, no account, no phone number. You and your friend each open
            this page and pass three short codes to each other over any app you already
            use — WhatsApp, email, anything. That app carries only ciphertext: it
            cannot read a single word, and neither can we.</p>""",
                      """  <p>No server, no account, no phone number. Each physical device becomes an
            independent hardware endpoint. You and your friend pass three short codes
            over any app you already use — WhatsApp, email, anything. That app carries
            only ciphertext: it cannot read a single word, and neither can we.</p>""",
                  ),
              ],
              "setu_connect_v1/web/breakit.html": [
                  (
                      """    <li>Someone who has your <b>unlocked phone</b>. Encryption ends where the
                screen begins.</li>""",
                      """    <li>Someone who controls your <b>unlocked hardware endpoint</b>. Encryption
                ends where the screen begins.</li>""",
                  ),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected one exact match, found {count}: {old[:80]!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          legacy = {
              "setu_connect_v1/README.md": ["two phones on one page"],
              "setu_connect_v1/web/index.html": ["two phones on one page"],
              "setu_connect_v1/web/demo.html": ["’s phone", "other phone’s connect-code", "this phone’s own code"],
              "setu_connect_v1/web/breakit.html": ["unlocked phone"],
          }
          for filename, phrases in legacy.items():
              text = Path(filename).read_text(encoding="utf-8")
              for phrase in phrases:
                  if phrase in text:
                      raise SystemExit(f"legacy framing remains in {filename}: {phrase}")

          Path(".github/workflows/temp-setu-hardware-wording.yml").unlink()

      - name: Verify public challenge after copy-only change
        run: |
          node tools_link_check.mjs
          node setu_connect_v1/harness/public_selfcheck.mjs
          node setu_connect_v1/harness/attack_suite.mjs
          node setu_connect_v1/harness/protocol_suite.mjs

      - name: Commit bounded wording update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reframe SETU demo as hardware endpoints"
          git push origin HEAD:${{ github.ref_name }}
