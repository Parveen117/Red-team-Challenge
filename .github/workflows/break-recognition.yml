name: Break Recognition CI

on:
  push:
    branches:
      - main
      - agent/break-recognition-v1
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenge:
    name: challenge (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact challenge state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit and adversarial controls
        run: python -m unittest discover -s tests -v

      - name: 50k subject/oracle target agreement campaign
        run: python -m challenge.campaign --cases 50000 --seed 117

      - name: Safe equivalent control
        run: python -m challenge.break_checker fixtures/equivalent_control.json

  windows-smoke:
    name: windows-smoke (${{ matrix.python-version }})
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout exact challenge state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Default unittest discovery works for fresh-clone users
        run: python -m unittest -v

      - name: Genesis and checker are Windows-portable
        run: python -m challenge.break_checker fixtures/equivalent_control.json

      - name: 10k subject/oracle smoke campaign
        run: python -m challenge.campaign --cases 10000 --seed 117
